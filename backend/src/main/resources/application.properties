# ============================================================
# intervals.icu API Konfiguration
# API-Key: intervals.icu → Einstellungen → API → Key generieren
# Athlete-ID: steht in der URL: intervals.icu/athlete/i12345/...
# ============================================================
intervals.api.key=xx
intervals.athlete.id=xx

# ============================================================
# Google Gemini API
# Key: https://aistudio.google.com/app/apikey
# ============================================================
gemini.api.key=xx
gemini.model=gemini-2.5-flash

# ============================================================
# Dein Leistungsprofil (für Zonen-Berechnung)
# FTP = Functional Threshold Power in Watt
# max-hr = Maximale Herzfrequenz in bpm
# ============================================================
cycling.ftp=${CYCLING_FTP:250}
cycling.max-hr=${CYCLING_MAX_HR:190}

# ============================================================
# Tagesempfehlung (Overview)
# Cron-Takt fuer die automatische Neuberechnung (Spring-Cron, 6 Felder).
# Default: alle 4 Stunden zur vollen Stunde (00:00, 04:00, 08:00 ...).
# ============================================================
recommendation.refresh.cron=${RECOMMENDATION_REFRESH_CRON:0 0 */4 * * *}

# ============================================================
# H2 Datenbank (persistent, nicht in-memory)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/cycling-analysis;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Server
# ============================================================
server.port=8080
spring.application.name=cycling-analysis
logging.level.com.cycling=DEBUG

# ============================================================
# SMTP-Verbindung (Standard Spring Boot Mail)
# Beispiel Gmail: smtp.gmail.com:587 + App-Passwort (kein normales PW!)
#   -> https://myaccount.google.com/apppasswords
# Beispiel Office365: smtp.office365.com:587
# ============================================================
spring.mail.host=xx
spring.mail.port=587
spring.mail.username=xx
spring.mail.password=xx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================================
# Report-Versand: Mail und Discord sind unabhaengig schaltbar (Default: beide aus).
# Ist ein Kanal aktiv, aber unvollstaendig konfiguriert, startet die App nicht.
# Fehlgeschlagene Sends werden alle 15 Min. erneut versucht (max. 5x, nur 2 Tage lang).
# ============================================================

# --- Mail ---
# from           -> Absender-EMAIL (leer = es wird spring.mail.username verwendet)
# from-name      -> Anzeigename des Absenders (z.B. "Cycling Report")
# to             -> Empfaenger-EMAIL (genau eine Adresse)
# subject-prefix -> Betreff-Praefix
cycling.report.mail.enabled=${REPORT_MAIL_ENABLED:false}
# Bei MailerSend MUSS die Domain verifiziert sein bzw. eine Trial-Sender-Adresse sein.
cycling.report.mail.from=${REPORT_MAIL_FROM:}
cycling.report.mail.from-name=Cycling Report
cycling.report.mail.to=${REPORT_MAIL_TO:}
cycling.report.mail.subject-prefix=Cycling Report

# --- Discord (Bot) ---
# Bot anlegen: https://discord.com/developers/applications -> Bot -> Reset Token
# Bot-Rechte im Kanal: View Channels, Send Messages, Embed Links, Attach Files
# Kanal-ID: Discord-Entwicklermodus an -> Rechtsklick auf Kanal -> "Kanal-ID kopieren"
# Den Token NIE committen, nur als Umgebungsvariable setzen.
cycling.report.discord.enabled=${REPORT_DISCORD_ENABLED:false}
cycling.report.discord.bot-token=${DISCORD_BOT_TOKEN:}
cycling.report.discord.channel-id=${DISCORD_CHANNEL_ID:}

# ============================================================
# QuickChart (rendert die Charts als PNG fuer den Mail-Versand).
# Default: oeffentlicher Endpoint. Fuer self-hosted z.B.
#   quickchart.base-url=http://quickchart:3400
# ============================================================
quickchart.base-url=${QUICKCHART_BASE_URL:https://quickchart.io}

