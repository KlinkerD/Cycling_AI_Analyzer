spring.application.name=weather-service
# Lokal 8085, damit die Services (intervals 8081, report 8082, training 8083) parallel aus der IDE laufen.
# Im Container 8080.
server.port=${SERVER_PORT:8085}
logging.level.com.cycling=DEBUG

# Nur der Health-Endpoint (Docker-Healthcheck)
management.endpoints.web.exposure.include=health

# ============================================================
# Open-Meteo (ohne API-Key, kostenlos fuer nicht-kommerzielle Nutzung)
# Forecast-API fuer die letzten Tage (15-Minuten-Werte), Archive-API (ERA5, stuendlich) fuer aeltere Fahrten.
# ============================================================
open-meteo.forecast-url=${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com}
open-meteo.archive-url=${OPEN_METEO_ARCHIVE_URL:https://archive-api.open-meteo.com}
open-meteo.user-agent=${OPEN_METEO_USER_AGENT:cycling-ai-analyzer (self-hosted)}
open-meteo.connect-timeout=5s
# Der report-service wartet hoechstens 10 s; inklusive einer Wiederholung nach 429 muss es darunter bleiben.
open-meteo.read-timeout=4s
open-meteo.retry-delay=1s
# Bis so viele Tage zurueck die Forecast-API (Open-Meteo erlaubt hoechstens 92)
open-meteo.forecast-past-days=90

# Wie lange geholte Modellreihen im Speicher bleiben
weather.cache-ttl=${WEATHER_CACHE_TTL:1h}
