asyncapi: 3.0.0
info:
  title: Cycling – MQTT-Nachrichten
  version: 1.0.0
  description: |
    Alle MQTT-Nachrichten zwischen den Services. Quelle der Wahrheit im Code:
    `cycling-messaging` (`Topics` und `com.cycling.messaging.contract`).

    **Lesart:** Die Spec beschreibt das ganze System, nicht einen einzelnen Service. Jede Operation
    gehört zu genau einem Service (Tag und `x-service`): `send` = dieser Service veröffentlicht,
    `receive` = dieser Service abonniert.

    **Regeln für alle Nachrichten**
    - Payload ist JSON (Jackson, Datumswerte als ISO-String, Bilder als Base64), unbekannte Felder werden ignoriert.
    - QoS 1, persistente Sessions (Clean Start aus, Session-Ablauf Standard 1 Tag): Nachrichten für einen
      kurz abwesenden Service hält der Broker vor.
    - Zustellung „mindestens einmal“: Empfänger deduplizieren über `requestId`, `activityId` bzw. `messageId`.
    - REST-Aufrufe (Frontend → Services, Services → intervals-service) stehen nicht hier, sondern in den
      OpenAPI-Specs unter `frontend/openapi/` bzw. in `intervals-api` (siehe `docs/datenfluesse.md`).
  tags:
    - name: intervals-service
      description: Einzige Anbindung an intervals.icu; meldet neue Fahrten und Fitness-Änderungen.
    - name: report-service
      description: Analysiert Fahrten (KI), speichert sie, versendet Reports.
    - name: training-service
      description: Zustand des Athleten; abends Fitness-Zusammenfassung, morgens Tagesempfehlung.
    - name: ai-service
      description: Gemini ohne Fachlichkeit; Prompt rein, Antworttext raus.
    - name: delivery-service
      description: Versand per Mail und Discord für alle Quellen.
    - name: ftp-service
      description: Erkennt auf Anfrage einen 20-Minuten-FTP-Test in einer Fahrt (FTP, LTHR, MaxHR).

defaultContentType: application/json

servers:
  mosquitto:
    host: mosquitto:1883
    protocol: mqtt
    protocolVersion: '5'
    description: Eclipse Mosquitto im Compose-Netz; lokal unter localhost:1883.
    bindings:
      mqtt:
        cleanSession: false
        keepAlive: 30
        sessionExpiryInterval: 86400
        bindingVersion: 0.2.0

channels:
  activityDetected:
    address: cycling/intervals/activity/detected
    title: Neue Rad-Aktivität
    description: |
      Bei jeder Abfrage (alle `INTERVALS_POLL_INTERVAL`, Standard 15 min) alle Rad-Fahrten der letzten 2 Tage.
      Mehrfaches Melden ist gewollt: der report-service überspringt Fahrten mit Report oder laufendem Job und
      startet so fehlgeschlagene Analysen erneut.
    messages:
      activityDetected:
        $ref: '#/components/messages/ActivityDetected'

  wellnessUpdated:
    address: cycling/intervals/wellness/updated
    title: Fitness-Werte geändert (retained)
    description: |
      Heutige CTL/ATL/Form/Ramp plus Vortag, sobald sich ein Wert (auf eine Nachkommastelle) ändert.
      Retained: neue Abonnenten bekommen sofort den letzten Stand.
    messages:
      wellnessUpdated:
        $ref: '#/components/messages/WellnessUpdated'

  aiRequest:
    address: cycling/ai/request/{source}
    title: KI-Auftrag
    description: |
      Fertiger Prompt für Gemini. Der letzte Topic-Teil ist die Quelle; der ai-service abonniert
      `cycling/ai/request/+` und antwortet auf `cycling/ai/result/{source}`. Prompt bauen und Antwort
      auswerten ist Sache des Absenders; neue Anwendungsfälle brauchen keine Änderung am ai-service.
    parameters:
      source:
        $ref: '#/components/parameters/aiSource'
    messages:
      aiRequest:
        $ref: '#/components/messages/AiRequest'

  aiResult:
    address: cycling/ai/result/{source}
    title: KI-Antwort
    description: Genau eine Antwort pro Auftrag, auch bei Fehlern (success=false).
    parameters:
      source:
        $ref: '#/components/parameters/aiSource'
    messages:
      aiResult:
        $ref: '#/components/messages/AiResult'

  deliveryRequest:
    address: cycling/delivery/request/{source}
    title: Versandauftrag
    description: |
      Neutrale Nachricht an den delivery-service. Der letzte Topic-Teil ist die Quelle; der delivery-service
      abonniert `cycling/delivery/request/+`. Neue Absender brauchen keine Änderung am delivery-service.
    parameters:
      source:
        $ref: '#/components/parameters/source'
    messages:
      deliveryMessage:
        $ref: '#/components/messages/DeliveryMessage'

  deliveryStatus:
    address: cycling/delivery/status
    title: Status des delivery-service (retained)
    description: |
      Aktive Kanäle und online/offline. Nach jedem Verbindungsaufbau retained mit `online=true`;
      fällt der Service unerwartet weg, setzt der Broker per Last Will `online=false`.
    messages:
      deliveryServiceStatus:
        $ref: '#/components/messages/DeliveryServiceStatus'

  detectFtpRequest:
    address: cycling/detect/ftp/request
    title: FTP-Test-Erkennung anfordern
    description: |
      Manuell aus dem Frontend ausgelöst (Button „FTP-Test auswerten“ auf der Report-Seite). Der
      ftp-service holt die Streams per REST beim report-service (`GET /api/reports/{activityId}/streams`).
    messages:
      detectFtpRequest:
        $ref: '#/components/messages/DetectFtpRequest'

  detectFtpResponse:
    address: cycling/detect/ftp/response
    title: Ergebnis der FTP-Test-Erkennung
    description: Genau eine Antwort pro Auftrag, technische Fehler mit `error`.
    messages:
      detectFtpResponse:
        $ref: '#/components/messages/DetectFtpResponse'

operations:
  # ---- intervals-service ---------------------------------------------------------------
  intervalsPublishActivityDetected:
    action: send
    channel:
      $ref: '#/channels/activityDetected'
    summary: Meldet Rad-Fahrten der letzten 2 Tage.
    tags:
      - name: intervals-service
    x-service: intervals-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  intervalsPublishWellnessUpdated:
    action: send
    channel:
      $ref: '#/channels/wellnessUpdated'
    summary: Meldet geänderte Fitness-Werte (retained).
    tags:
      - name: intervals-service
    x-service: intervals-service
    bindings:
      mqtt:
        qos: 1
        retain: true
        bindingVersion: 0.2.0

  # ---- report-service ------------------------------------------------------------------
  reportReceiveActivityDetected:
    action: receive
    channel:
      $ref: '#/channels/activityDetected'
    summary: Startet die Analyse für Fahrten ohne Report und ohne laufenden Job.
    tags:
      - name: report-service
    x-service: report-service

  reportSendAnalysisRequest:
    action: send
    channel:
      $ref: '#/channels/aiRequest'
    summary: Analyse-Prompt (AnalysisPrompt, json=true, Temperatur 0.3) auf `cycling/ai/request/report`.
    description: |
      requestId = ID des Analyse-Jobs. Abbruch, wenn nach `ANALYSIS_JOB_TIMEOUT` (Standard 15 min) keine
      Antwort kommt; eine später eintreffende Antwort wird trotzdem übernommen.
    tags:
      - name: report-service
    x-service: report-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0
    reply:
      channel:
        $ref: '#/channels/aiResult'

  reportReceiveAnalysisResult:
    action: receive
    channel:
      $ref: '#/channels/aiResult'
    summary: Liest die JSON-Bewertung, speichert die Analyse und versendet den Report (idempotent je Job).
    description: Antwort ohne lesbares JSON setzt den Job auf FAILED. Abo `cycling/ai/result/report`.
    tags:
      - name: report-service
    x-service: report-service

  reportReceiveDeliveryStatus:
    action: receive
    channel:
      $ref: '#/channels/deliveryStatus'
    summary: Merkt sich die aktiven Kanäle für „Erneut senden“ (409/503 ohne Rundreise).
    tags:
      - name: report-service
    x-service: report-service

  reportSendDeliveryMessage:
    action: send
    channel:
      $ref: '#/channels/deliveryRequest'
    summary: Report mit Charts als DeliveryMessage (Quelle `report`).
    description: |
      messageId = Job-ID (nach Analyse) bzw. neue UUID (je Klick auf „Erneut senden“).
      Schlägt Rendern oder Senden fehl, wird nach 1, 5 und 15 Minuten wiederholt.
    tags:
      - name: report-service
    x-service: report-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  reportSendFtpDetectionRequest:
    action: send
    channel:
      $ref: '#/channels/detectFtpRequest'
    summary: Fordert die FTP-Test-Erkennung für eine Fahrt an (POST /api/reports/{activityId}/ftp-detection).
    description: |
      requestId = neue UUID je Lauf. Läuft schon ein Lauf, wird nichts gesendet. Ohne Antwort nach
      `FTP_DETECTION_TIMEOUT` (Standard 2 min) gilt der Lauf als FAILED.
    tags:
      - name: report-service
    x-service: report-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0
    reply:
      channel:
        $ref: '#/channels/detectFtpResponse'

  reportReceiveFtpDetectionResponse:
    action: receive
    channel:
      $ref: '#/channels/detectFtpResponse'
    summary: Speichert das Ergebnis zur Fahrt (ein Ergebnis pro Aktivität, neuer Lauf überschreibt).
    description: Antworten mit fremder requestId (alter Lauf) werden verworfen.
    tags:
      - name: report-service
    x-service: report-service

  # ---- ftp-service ---------------------------------------------------------------------
  ftpReceiveDetectionRequest:
    action: receive
    channel:
      $ref: '#/channels/detectFtpRequest'
    summary: Holt die Streams und prüft den besten 20-Minuten-Block auf einen FTP-Test.
    description: |
      Ein Block gilt als Test, wenn höchstens 5 % Leistungs-/Pulswerte fehlen, die Leistung mindestens 25 %
      über dem Rest der Fahrt liegt und der Puls der letzten 5 min mindestens 90 % der MaxHR erreicht.
      Ohne Puls kein Test. Schwellwerte über `FTP_DETECTION_*` einstellbar.
    tags:
      - name: ftp-service
    x-service: ftp-service

  ftpSendDetectionResponse:
    action: send
    channel:
      $ref: '#/channels/detectFtpResponse'
    summary: FTP (20-min-Mittel × 0,95), LTHR (20-min-Puls), MaxHR (bestes 5-s-Mittel) oder Fehler.
    tags:
      - name: ftp-service
    x-service: ftp-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  # ---- training-service ----------------------------------------------------------------
  trainingReceiveWellnessUpdated:
    action: receive
    channel:
      $ref: '#/channels/wellnessUpdated'
    summary: Hält den letzten Stand für die Fitness-Zusammenfassung.
    tags:
      - name: training-service
    x-service: training-service

  trainingSendFitnessMessage:
    action: send
    channel:
      $ref: '#/channels/deliveryRequest'
    summary: Fitness-Zusammenfassung ab `FITNESS_SUMMARY_TIME` (Quelle `fitness`).
    description: messageId `fitness-daily-<datum>`, damit pro Tag nur eine Nachricht verschickt wird.
    tags:
      - name: training-service
    x-service: training-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  trainingSendRecommendationPrompt:
    action: send
    channel:
      $ref: '#/channels/aiRequest'
    summary: Prompt für den Empfehlungstext (RecommendationPrompt, json=false) auf `cycling/ai/request/training`.
    description: Die Kategorie steht vorher fest; höchstens 90 s wird auf den Text gewartet.
    tags:
      - name: training-service
    x-service: training-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0
    reply:
      channel:
        $ref: '#/channels/aiResult'

  trainingReceiveRecommendationText:
    action: receive
    channel:
      $ref: '#/channels/aiResult'
    summary: Ersetzt den Fallback-Text; Antworten auf ältere Berechnungen werden ignoriert.
    description: Abo `cycling/ai/result/training`.
    tags:
      - name: training-service
    x-service: training-service

  trainingSendRecommendationMessage:
    action: send
    channel:
      $ref: '#/channels/deliveryRequest'
    summary: Morgen-Empfehlung ab `RECOMMENDATION_DAILY_TIME` (Quelle `recommendation`).
    description: messageId `recommendation-daily-<datum>`.
    tags:
      - name: training-service
    x-service: training-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  # ---- ai-service ----------------------------------------------------------------------
  aiReceiveRequest:
    action: receive
    channel:
      $ref: '#/channels/aiRequest'
    summary: Reicht den Prompt unverändert an Gemini weiter (Abo `cycling/ai/request/+`).
    description: |
      Leerer Prompt oder Temperatur außerhalb 0 … 2 wird ohne Gemini-Aufruf mit success=false beantwortet.
      Zwischen zwei Aufrufen liegen mindestens `GEMINI_MIN_INTERVAL` (Standard 5 s).
    tags:
      - name: ai-service
    x-service: ai-service

  aiSendResult:
    action: send
    channel:
      $ref: '#/channels/aiResult'
    summary: Antworttext oder Fehler (success=false) mit derselben requestId, an die Quelle des Auftrags.
    tags:
      - name: ai-service
    x-service: ai-service
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  # ---- delivery-service ----------------------------------------------------------------
  deliveryReceiveDeliveryMessage:
    action: receive
    channel:
      $ref: '#/channels/deliveryRequest'
    summary: Speichert und versendet per Mail/Discord (Abo `cycling/delivery/request/+`).
    description: |
      Doppelte messageId wird verworfen. Wiederholung alle 15 Minuten (höchstens 5×, 2 Tage);
      unbekannte Ziele gelten sofort als fehlgeschlagen.
    tags:
      - name: delivery-service
    x-service: delivery-service

  deliverySendStatus:
    action: send
    channel:
      $ref: '#/channels/deliveryStatus'
    summary: Status retained nach jedem Verbindungsaufbau; Last Will mit online=false.
    tags:
      - name: delivery-service
    x-service: delivery-service
    bindings:
      mqtt:
        qos: 1
        retain: true
        bindingVersion: 0.2.0

components:
  parameters:
    aiSource:
      description: Absender des KI-Auftrags; die Antwort geht an dieselbe Quelle.
      enum:
        - report
        - training
    source:
      description: Absender des Versandauftrags.
      enum:
        - report
        - fitness
        - recommendation

  messages:
    ActivityDetected:
      name: ActivityDetected
      title: Neue Rad-Aktivität
      summary: Zusammenfassung der Fahrt, damit die Analyse ohne weiteren Abruf starten kann.
      payload:
        $ref: '#/components/schemas/ActivityDetected'
    WellnessUpdated:
      name: WellnessUpdated
      title: Fitness-Werte heute und gestern
      payload:
        $ref: '#/components/schemas/WellnessUpdated'
    AiRequest:
      name: AiRequest
      title: Prompt für Gemini
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/AiRequest'
    AiResult:
      name: AiResult
      title: Antwort von Gemini
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/AiResult'
    DeliveryMessage:
      name: DeliveryMessage
      title: Neutrale Nachricht für Mail/Discord
      payload:
        $ref: '#/components/schemas/DeliveryMessage'
    DeliveryServiceStatus:
      name: DeliveryServiceStatus
      title: Status des delivery-service
      payload:
        $ref: '#/components/schemas/DeliveryServiceStatus'
    DetectFtpRequest:
      name: DetectFtpRequest
      title: Fahrt auf FTP-Test prüfen
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/DetectFtpRequest'
    DetectFtpResponse:
      name: DetectFtpResponse
      title: Ergebnis der FTP-Test-Erkennung
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/DetectFtpResponse'

  correlationIds:
    requestId:
      description: Antworten tragen dieselbe requestId wie der Auftrag.
      location: $message.payload#/requestId

  schemas:
    ActivityDetected:
      type: object
      required: [activityId]
      properties:
        activityId: { type: string, examples: [i123456] }
        name: { type: [string, 'null'] }
        startDateLocal: { type: [string, 'null'], description: 'Lokale Startzeit, z. B. 2026-11-01T08:30:00' }
        type: { type: [string, 'null'], examples: [Ride, VirtualRide] }
        distance: { type: [number, 'null'], description: Meter }
        movingTime: { type: [integer, 'null'], description: Sekunden }
        elapsedTime: { type: [integer, 'null'], description: Sekunden }
        averageWatts: { type: [number, 'null'] }
        normalizedPower: { type: [number, 'null'] }
        maxWatts: { type: [number, 'null'] }
        averageHeartrate: { type: [number, 'null'] }
        maxHeartrate: { type: [number, 'null'] }
        averageSpeed: { type: [number, 'null'], description: m/s }
        totalElevationGain: { type: [number, 'null'], description: Meter }

    WellnessValues:
      type: object
      properties:
        date: { type: string, format: date }
        ctl: { type: [number, 'null'], description: Fitness }
        atl: { type: [number, 'null'], description: Fatigue }
        form: { type: [number, 'null'], description: CTL - ATL }
        rampRate: { type: [number, 'null'], description: Ramp laut intervals.icu }

    WellnessUpdated:
      type: object
      required: [today]
      properties:
        today:
          $ref: '#/components/schemas/WellnessValues'
        previousDay:
          description: null, wenn intervals.icu für gestern keine Werte hat
          oneOf:
            - $ref: '#/components/schemas/WellnessValues'
            - type: 'null'

    AiRequest:
      type: object
      required: [requestId, prompt, temperature, json]
      properties:
        requestId: { type: string, description: 'Korrelation, z. B. ID des Analyse-Jobs' }
        prompt: { type: string, minLength: 1, description: vollständiger Prompt, geht unverändert an Gemini }
        temperature: { type: number, minimum: 0, maximum: 2, examples: [0.3, 0.5] }
        json: { type: boolean, description: true = Gemini soll reines JSON liefern (der Absender parst es) }

    AiResult:
      type: object
      required: [requestId, success]
      properties:
        requestId: { type: string }
        success: { type: boolean }
        error: { type: [string, 'null'], description: Grund bei success=false }
        text: { type: [string, 'null'], description: Antworttext unverändert; null bei success=false }

    DeliveryMessage:
      type: object
      required: [messageId, title]
      properties:
        messageId: { type: string, description: eindeutig; doppelte IDs werden nur einmal versendet }
        title: { type: string, examples: ['🚴 Morgenrunde'] }
        subtitle: { type: [string, 'null'] }
        color: { type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$' }
        fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              text: { type: string }
              color: { type: [string, 'null'] }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: 'stabile Kennung, wird Dateiname bzw. Mail-CID' }
              title: { type: [string, 'null'] }
              png: { type: string, contentEncoding: base64 }
        footer: { type: [string, 'null'] }
        targets:
          type: array
          description: leer = Ziel "default" jedes aktiven Kanals
          items:
            type: object
            properties:
              channel: { type: string, enum: [MAIL, DISCORD] }
              destination: { type: string, examples: [default, reports, fitness, recommendation] }

    DeliveryServiceStatus:
      type: object
      required: [online, channels]
      properties:
        online: { type: boolean }
        channels:
          type: array
          description: aktive Kanäle; leer = Versand abgeschaltet
          items: { type: string, enum: [MAIL, DISCORD] }

    DetectFtpRequest:
      type: object
      required: [requestId, activityId]
      properties:
        requestId: { type: string, description: 'neu je Lauf; kommt in der Antwort zurück' }
        activityId: { type: string, examples: [i123456] }

    DetectFtpResponse:
      type: object
      required: [requestId, activityId, isFtpDetected]
      properties:
        requestId: { type: string }
        activityId: { type: string }
        isFtpDetected: { type: boolean, description: false auch bei Fehlern (dann ist error gesetzt) }
        ftp: { type: [integer, 'null'], description: 'Watt, 20-min-Mittel × 0,95' }
        maxHr: { type: [integer, 'null'], description: 'bpm, höchstes 5-s-Mittel der Fahrt' }
        lthr: { type: [integer, 'null'], description: 'bpm, mittlerer Puls im 20-min-Block' }
        avgPower20Min: { type: [integer, 'null'], description: 'Watt, mittlere Leistung im 20-min-Block' }
        windowStartSeconds: { type: [integer, 'null'], description: 'Start des Blocks in s ab Fahrtbeginn' }
        error: { type: [string, 'null'], description: technischer Fehler; null, wenn die Erkennung gelaufen ist }
