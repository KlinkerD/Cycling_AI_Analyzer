spring.application.name=stats-service
logging.level.com.cycling=DEBUG

# ============================================================
# Statistik ueber alle Fahrten: Zeit in Leistungs- und HF-Zonen, km, Zeit, Hoehenmeter, Anzahl,
# Trainingslast je Woche, Monat und Jahr.
# REST-API: /api/stats (Frontend). Lokal auf 8086, im Container auf 8080 (SERVER_PORT).
# ============================================================
server.port=${SERVER_PORT:8086}
# Nur /actuator/health (Docker-Healthcheck)
management.endpoints.web.exposure.include=health

# OpenAPI (springdoc): Grundlage fuer den Angular-Client (frontend/openapi/stats-api.yaml).
springdoc.api-docs.version=openapi_3_0
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.paths-to-match=/api/**

# ============================================================
# intervals-service: Fahrten und Zonenzeiten. Lokal auf Port 8081.
# ============================================================
intervals-service.base-url=${INTERVALS_SERVICE_URL:http://localhost:8081}
intervals-service.connect-timeout=5s
intervals-service.read-timeout=60s

# ============================================================
# MQTT-Broker
# Rein: cycling/intervals/activity/detected (ActivityDetected, neue Fahrt)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:stats-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}

# Zeitzone fuer "heute", den 1.1. und den Nachtabgleich
stats.zone=${STATS_ZONE:Europe/Berlin}

# ============================================================
# Erstimport beim Start: alle Fahrten ab dem 1.1. des laufenden Jahres minus years-back Jahre
# (1 = ab 1.1. des Vorjahres). Bereits gespeicherte Fahrten werden uebersprungen.
# ============================================================
stats.import.on-start=true
stats.import.years-back=${STATS_IMPORT_YEARS_BACK:1}

# ============================================================
# Nachtabgleich: die letzten reconcile.days Tage neu laden, in intervals.icu geloeschte Fahrten
# entfernen, fehlende Zonen nachholen (Spring-Cron, 6 Felder).
# ============================================================
stats.reconcile.cron=${STATS_RECONCILE_CRON:0 30 3 * * *}
stats.reconcile.days=${STATS_RECONCILE_DAYS:30}

# ============================================================
# H2-Datenbank (Datei): eine Zeile pro Fahrt, Summen werden bei der Abfrage gebildet.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/stats;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
