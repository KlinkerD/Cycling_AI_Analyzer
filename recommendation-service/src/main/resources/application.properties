spring.application.name=recommendation-service
# Kein Webserver: der Service spricht REST nur als Client (intervals-service) und sonst MQTT.
spring.main.web-application-type=none
spring.main.keep-alive=true
logging.level.com.cycling=DEBUG

# ============================================================
# intervals-service: Wellness (21 Tage) und Fahrten (7 Tage)
# ============================================================
intervals-service.base-url=${INTERVALS_SERVICE_URL:http://localhost:8081}
intervals-service.connect-timeout=5s
intervals-service.read-timeout=30s

# ============================================================
# MQTT-Broker
# Rein:  cycling/recommendation/refresh (Refresh-Button im backend)
#        cycling/ai/recommendation/result (KI-Text)
# Raus:  cycling/recommendation/updated (retained, Overview-Karte im backend)
#        cycling/ai/recommendation/request (KI-Auftrag)
#        cycling/delivery/request/recommendation (Morgen-Nachricht an den delivery-service)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:recommendation-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}

# Zeitzone fuer Zeitplan, Versandzeit und "heute"
recommendation.zone=${RECOMMENDATION_ZONE:Europe/Berlin}
# Regelmaessige Neuberechnung fuer die Overview-Karte (Spring-Cron, 6 Felder)
recommendation.refresh.cron=${RECOMMENDATION_REFRESH_CRON:0 0 */4 * * *}
# So lange wird hoechstens auf den KI-Text gewartet, danach bleibt der Fallback-Text
recommendation.text-timeout=90s

# ============================================================
# Morgen-Nachricht: ab dieser Uhrzeit (HH:mm) einmal pro Tag, frisch berechnet.
# Gesendet wird mit KI-Text, spaetestens nach text-wait mit Fallback-Text.
# Nach einem Neustart wird nur bis catch-up-until nachgeholt.
# ============================================================
recommendation.daily.time=${RECOMMENDATION_DAILY_TIME:09:00}
recommendation.daily.catch-up-until=${RECOMMENDATION_DAILY_CATCH_UP_UNTIL:12:00}
recommendation.daily.text-wait=2m
recommendation.daily.check-interval=1m
recommendation.daily.initial-delay=1m

# ============================================================
# Ziele beim delivery-service, Format KANAL:ziel, kommagetrennt.
# Das Ziel "recommendation" muss im delivery-service konfiguriert sein
# (DELIVERY_DISCORD_DESTINATIONS_RECOMMENDATION). Leer = an das Ziel "default" jedes aktiven Kanals.
# ============================================================
recommendation.targets=${RECOMMENDATION_TARGETS:DISCORD:recommendation}
