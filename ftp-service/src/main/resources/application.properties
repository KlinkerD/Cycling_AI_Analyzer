spring.application.name=ftp-service
# Kein Webserver: der Service spricht nur MQTT (rein/raus) und holt die Streams per REST beim intervals-service.
spring.main.web-application-type=none
spring.main.keep-alive=true
logging.level.com.cycling=DEBUG

# ============================================================
# intervals-service: liefert die Streams einer Fahrt. Lokal auf Port 8081.
# ============================================================
intervals-service.base-url=${INTERVALS_SERVICE_URL:http://localhost:8081}
intervals-service.connect-timeout=5s
intervals-service.read-timeout=60s

# ============================================================
# FTP-Test-Erkennung (20-Minuten-Test). Ein Block gilt als Test, wenn alle Kriterien passen.
# ============================================================
# Laenge des Testblocks in Sekunden
ftp.detection.window-seconds=${FTP_DETECTION_WINDOW_SECONDS:1200}
# Hoechstens so viel Anteil fehlender Leistungs-/Pulswerte im Block
ftp.detection.max-missing-fraction=${FTP_DETECTION_MAX_MISSING_FRACTION:0.05}
# Block-Leistung >= Faktor * mittlere Leistung ausserhalb des Blocks (ohne Rollen)
ftp.detection.min-rest-ratio=${FTP_DETECTION_MIN_REST_RATIO:1.25}
# Ausbelastung: Puls der letzten final-seconds des Blocks >= Anteil der MaxHR der Fahrt
ftp.detection.final-seconds=${FTP_DETECTION_FINAL_SECONDS:300}
ftp.detection.min-final-hr-fraction=${FTP_DETECTION_MIN_FINAL_HR_FRACTION:0.90}
# FTP = 20-Minuten-Mittel * Faktor
ftp.detection.ftp-factor=${FTP_DETECTION_FTP_FACTOR:0.95}
# MaxHR = hoechstes gleitendes Mittel ueber so viele Sekunden (glaettet Sensor-Ausreisser)
ftp.detection.max-hr-smoothing-seconds=${FTP_DETECTION_MAX_HR_SMOOTHING_SECONDS:5}

# ============================================================
# MQTT-Broker
# Rein: cycling/detect/ftp/request (DetectFtpRequest)
# Raus: cycling/detect/ftp/response (DetectFtpResponse)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:ftp-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}
