name: Build and publish Docker images

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cycling-backend
          - name: ai-service
            context: .
            dockerfile: ./ai-service/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cycling-ai-service
          - name: report-service
            context: .
            dockerfile: ./report-service/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cycling-report
          - name: delivery-service
            context: .
            dockerfile: ./delivery-service/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cycling-delivery
          - name: intervals-service
            context: .
            dockerfile: ./intervals-service/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cycling-intervals
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cycling-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
