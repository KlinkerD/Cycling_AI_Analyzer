spring.application.name=delivery-service
# Kein Webserver: der Service spricht nur MQTT.
spring.main.web-application-type=none
spring.main.keep-alive=true
logging.level.com.cycling=DEBUG

# ============================================================
# MQTT-Broker
# Rein: cycling/delivery/request/<quelle> (DeliveryMessage), z. B. .../report
# Raus: cycling/delivery/status (retained, aktive Kanaele)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:delivery-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}

# ============================================================
# Eigene H2-Datenbank: Nachrichten (delivery_message) und Versandstatus (delivery)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/delivery;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Aufbewahrung: Inhalt (Bilder) nach 7 Tagen loeschen, Statuszeilen nach 90 Tagen.
# payload muss mindestens 2 Tage sein (so lange wird wiederholt).
delivery.retention.payload=${DELIVERY_RETENTION_PAYLOAD:7d}
delivery.retention.status=${DELIVERY_RETENTION_STATUS:90d}

# ============================================================
# SMTP-Verbindung (Standard Spring Boot Mail)
# Beispiel Gmail: smtp.gmail.com:587 + App-Passwort (kein normales PW!)
#   -> https://myaccount.google.com/apppasswords
# Beispiel Office365: smtp.office365.com:587
# ============================================================
spring.mail.host=xx
spring.mail.port=587
spring.mail.username=xx
spring.mail.password=xx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================================
# Kanaele: Mail und Discord sind unabhaengig schaltbar (Default: beide aus).
# Ist ein Kanal aktiv, aber unvollstaendig konfiguriert, startet die App nicht.
# Fehlgeschlagene Sends werden alle 15 Min. erneut versucht (max. 5x, nur 2 Tage lang).
#
# Ziele: Absender nennen nur logische Namen ("default", "reports", "alerts", ...).
# Die echten Adressen stehen hier unter delivery.<kanal>.destinations.<name>.
# Nachrichten ohne Ziel gehen an "default" jedes aktiven Kanals; unbekannte Ziele -> FAILED.
# Weitere Ziele per Env-Variable, z. B.:
#   DELIVERY_DISCORD_DESTINATIONS_REPORTS=123456789012345678
#   DELIVERY_MAIL_DESTINATIONS_ALERTS=ops@example.com
# ============================================================

# --- Mail ---
# from           -> Absender-EMAIL (leer = es wird spring.mail.username verwendet)
# from-name      -> Anzeigename des Absenders (z.B. "Cycling Report")
# subject-prefix -> Betreff-Praefix
delivery.mail.enabled=${REPORT_MAIL_ENABLED:false}
# Bei MailerSend MUSS die Domain verifiziert sein bzw. eine Trial-Sender-Adresse sein.
delivery.mail.from=${REPORT_MAIL_FROM:}
delivery.mail.from-name=Cycling Report
delivery.mail.subject-prefix=Cycling Report
delivery.mail.destinations.default=${REPORT_MAIL_TO:}

# --- Discord (Bot) ---
# Bot anlegen: https://discord.com/developers/applications -> Bot -> Reset Token
# Bot-Rechte in jedem Ziel-Kanal: View Channels, Send Messages, Embed Links, Attach Files
# Kanal-ID: Discord-Entwicklermodus an -> Rechtsklick auf Kanal -> "Kanal-ID kopieren"
# Den Token NIE committen, nur als Umgebungsvariable setzen.
delivery.discord.enabled=${REPORT_DISCORD_ENABLED:false}
delivery.discord.bot-token=${DISCORD_BOT_TOKEN:}
delivery.discord.destinations.default=${DISCORD_CHANNEL_ID:}
