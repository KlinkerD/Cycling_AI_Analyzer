openapi: 3.0.1
info:
  title: Cycling Fitness API
  version: "1"
servers:
- url: /
paths:
  /api/fitness/athlete:
    get:
      operationId: getAthlete
      parameters:
      - in: query
        name: refresh
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteZonesDto"
          description: OK
      tags:
      - Fitness
  /api/fitness/wellness:
    get:
      operationId: getWellness
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: refresh
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WellnessPointDto"
          description: OK
      tags:
      - Fitness
components:
  schemas:
    AthleteThresholdsDto:
      type: object
      properties:
        ftp:
          type: integer
          format: int32
          nullable: true
        indoorFtp:
          type: integer
          format: int32
          nullable: true
        lthr:
          type: integer
          format: int32
          nullable: true
        maxHr:
          type: integer
          format: int32
          nullable: true
        name:
          type: string
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
      required:
      - ftp
      - indoorFtp
      - lthr
      - maxHr
      - name
      - weight
    AthleteZonesDto:
      type: object
      properties:
        hrReference:
          type: string
          enum:
          - lthr
          - max_hr
        hrZones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneDto"
        powerZones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneDto"
        thresholds:
          $ref: "#/components/schemas/AthleteThresholdsDto"
      required:
      - hrReference
      - hrZones
      - powerZones
      - thresholds
    WellnessPointDto:
      type: object
      properties:
        atl:
          type: number
          format: double
          nullable: true
        ctl:
          type: number
          format: double
          nullable: true
        date:
          type: string
        form:
          type: number
          format: double
          nullable: true
      required:
      - atl
      - ctl
      - date
      - form
    ZoneDto:
      type: object
      properties:
        color:
          type: string
        index:
          type: integer
          format: int32
        lowerPct:
          type: number
          format: double
          nullable: true
        lowerValue:
          type: integer
          format: int32
          nullable: true
        name:
          type: string
        upperPct:
          type: number
          format: double
          nullable: true
        upperValue:
          type: integer
          format: int32
          nullable: true
      required:
      - color
      - index
      - lowerPct
      - lowerValue
      - name
      - upperPct
      - upperValue
