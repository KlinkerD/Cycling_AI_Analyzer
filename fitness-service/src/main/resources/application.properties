spring.application.name=fitness-service
# Kein Webserver: der Service spricht nur MQTT.
spring.main.web-application-type=none
spring.main.keep-alive=true
logging.level.com.cycling=DEBUG

# ============================================================
# MQTT-Broker
# Rein: cycling/intervals/wellness/updated (WellnessUpdated, retained)
# Raus: cycling/delivery/request/fitness (DeliveryMessage an den delivery-service)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:fitness-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}

# ============================================================
# Tageszusammenfassung: ab dieser Uhrzeit (HH:mm, in dieser Zeitzone) einmal pro Tag.
# Liegt dann noch kein Stand von heute vor, wird bis Mitternacht nachgeholt.
# ============================================================
fitness.summary.time=${FITNESS_SUMMARY_TIME:21:00}
fitness.summary.zone=${FITNESS_SUMMARY_ZONE:Europe/Berlin}
fitness.summary.check-interval=1m
fitness.summary.initial-delay=1m

# ============================================================
# Ziele beim delivery-service, Format KANAL:ziel, kommagetrennt.
# Das Ziel "fitness" muss im delivery-service konfiguriert sein (DELIVERY_DISCORD_DESTINATIONS_FITNESS).
# Leer = an das Ziel "default" jedes aktiven Kanals.
#   Beispiel: FITNESS_TARGETS=DISCORD:fitness,MAIL:default
# ============================================================
fitness.targets=${FITNESS_TARGETS:DISCORD:fitness}
