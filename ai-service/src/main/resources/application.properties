spring.application.name=ai-service
# Kein Webserver: der Service spricht nur MQTT. keep-alive haelt die JVM am Laufen.
spring.main.web-application-type=none
spring.main.keep-alive=true
logging.level.com.cycling=DEBUG

# ============================================================
# Google Gemini API
# Key: https://aistudio.google.com/app/apikey
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Mindestabstand zwischen zwei Gemini-Aufrufen (schont das Rate-Limit)
gemini.min-interval=${GEMINI_MIN_INTERVAL:5s}

# ============================================================
# MQTT-Broker
# Rein: cycling/ai/request/+ (AiRequest, letzter Teil = Quelle)
# Raus: cycling/ai/result/<quelle> (AiResult)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:ai-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}
