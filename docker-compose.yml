
services:

  # MQTT-Broker: verbindet intervals-service, ai-service, report-service, training-service,
  # ftp-service und delivery-service.
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: cycling-mosquitto
    ports:
      # Nur lokal freigeben (fuer Entwicklung aus der IDE), nicht ins LAN.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3", "-i", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # intervals-service: einzige Anbindung an intervals.icu. REST-API mit Cache fuer report-, training- und
  # ftp-service, meldet neue Aktivitaeten und Fitness-Aenderungen per MQTT. Kein Port nach aussen.
  intervals-service:
    build:
      context: .
      dockerfile: intervals-service/Dockerfile
    container_name: cycling-intervals
    environment:
      - INTERVALS_API_KEY=${INTERVALS_API_KEY}
      - INTERVALS_ATHLETE_ID=${INTERVALS_ATHLETE_ID}
      - INTERVALS_POLL_INTERVAL=${INTERVALS_POLL_INTERVAL:-15m}
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    # Zum Debuggen bei Bedarf nur lokal freigeben:
    # ports:
    #   - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # ai-service: beantwortet Analyse- und Empfehlungs-Auftraege mit Gemini
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: cycling-ai-service
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # weather-service: Temperatur, Wind und Regen zu Ort und Zeitpunkt von Open-Meteo (ohne API-Key), per REST
  # fuer den report-service. Zustandslos mit kurzem Cache, kein Port nach aussen.
  weather-service:
    build:
      context: .
      dockerfile: weather-service/Dockerfile
    container_name: cycling-weather
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # report-service: analysiert neue Fahrten (KI-Auftrag an den ai-service), speichert die Analysen (H2),
  # liefert Aktivitaetsliste und Report-Seite per REST (/api/reports) und schickt Reports an den delivery-service.
  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: cycling-report
    volumes:
      - report-data:/app/data
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - INTERVALS_SERVICE_URL=http://intervals-service:8080
      # Wetter fuer Outdoor-Fahrten (leer = ohne Wetter)
      - WEATHER_SERVICE_URL=${WEATHER_SERVICE_URL-http://weather-service:8080}
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/report;AUTO_SERVER=TRUE
      - CYCLING_FTP=${CYCLING_FTP:-250}
      - CYCLING_MAX_HR=${CYCLING_MAX_HR:-190}
      - QUICKCHART_BASE_URL=${QUICKCHART_BASE_URL:-https://quickchart.io}
      # Kartenkacheln fuer das Kartenbild im Versand (leer = Route ohne Karte)
      - REPORT_MAP_TILE_URL=${REPORT_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      # Ziele der Reports, z. B. DISCORD:reports,MAIL:default (leer = "default" jedes aktiven Kanals)
      - REPORT_TARGETS=${REPORT_TARGETS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mosquitto:
        condition: service_healthy
      intervals-service:
        condition: service_healthy
      # nur gestartet, nicht gesund: ohne Wetter laeuft die Analyse trotzdem
      weather-service:
        condition: service_started
    restart: unless-stopped

  # training-service: Zustand des Athleten und Tagesempfehlung. Liefert Fitness-Chart und Athleten-Profil
  # (/api/fitness) und die Empfehlung (/api/recommendation) per REST, schickt abends die Fitness-Zusammenfassung
  # und morgens die Empfehlung an den delivery-service. Texte formuliert der ai-service. Kein eigener Speicher.
  training-service:
    build:
      context: .
      dockerfile: training-service/Dockerfile
    container_name: cycling-training
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - INTERVALS_SERVICE_URL=http://intervals-service:8080
      - TRAINING_ZONE=${TRAINING_ZONE:-Europe/Berlin}
      - FITNESS_SUMMARY_TIME=${FITNESS_SUMMARY_TIME:-21:00}
      # Ziel beim delivery-service; "fitness" braucht dort DELIVERY_DISCORD_DESTINATIONS_FITNESS
      - FITNESS_TARGETS=${FITNESS_TARGETS:-DISCORD:fitness}
      - RECOMMENDATION_REFRESH_CRON=${RECOMMENDATION_REFRESH_CRON:-0 0 */4 * * *}
      - RECOMMENDATION_DAILY_TIME=${RECOMMENDATION_DAILY_TIME:-09:00}
      - RECOMMENDATION_DAILY_CATCH_UP_UNTIL=${RECOMMENDATION_DAILY_CATCH_UP_UNTIL:-12:00}
      # Ziel beim delivery-service; "recommendation" braucht dort DELIVERY_DISCORD_DESTINATIONS_RECOMMENDATION
      - RECOMMENDATION_TARGETS=${RECOMMENDATION_TARGETS:-DISCORD:recommendation}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      mosquitto:
        condition: service_healthy
      intervals-service:
        condition: service_healthy
    restart: unless-stopped

  # stats-service: Statistik ueber alle Fahrten (Zeit in Leistungs-/HF-Zonen, km, Zeit, Hoehenmeter, Anzahl,
  # Trainingslast) je Woche, Monat und Jahr per REST (/api/stats). Haelt die Fahrten in einer eigenen H2-Datenbank:
  # Erstimport ab 1.1. des Vorjahres beim Start, neue Fahrten per ActivityDetected, nachts Abgleich der letzten Tage.
  stats-service:
    build:
      context: .
      dockerfile: stats-service/Dockerfile
    container_name: cycling-stats
    volumes:
      - stats-data:/app/data
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - INTERVALS_SERVICE_URL=http://intervals-service:8080
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/stats;AUTO_SERVER=TRUE
      - STATS_ZONE=${STATS_ZONE:-Europe/Berlin}
      # Erstimport ab 1.1. des laufenden Jahres minus so vieler Jahre (1 = ab 1.1. des Vorjahres)
      - STATS_IMPORT_YEARS_BACK=${STATS_IMPORT_YEARS_BACK:-1}
      - STATS_RECONCILE_CRON=${STATS_RECONCILE_CRON:-0 30 3 * * *}
      - STATS_RECONCILE_DAYS=${STATS_RECONCILE_DAYS:-30}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mosquitto:
        condition: service_healthy
      intervals-service:
        condition: service_healthy
    restart: unless-stopped

  # ftp-service: erkennt auf Anfrage (Button auf der Report-Seite) einen 20-Minuten-FTP-Test in einer Fahrt
  # und berechnet FTP, LTHR und MaxHR. Streams per REST vom intervals-service, Auftrag/Ergebnis per MQTT.
  # Kein Webserver, kein Speicher.
  ftp-service:
    build:
      context: .
      dockerfile: ftp-service/Dockerfile
    container_name: cycling-ftp
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - INTERVALS_SERVICE_URL=http://intervals-service:8080
      # Schwellwerte der Erkennung (Defaults siehe ftp-service/src/main/resources/application.properties)
      - FTP_DETECTION_MIN_REST_RATIO=${FTP_DETECTION_MIN_REST_RATIO:-1.25}
      - FTP_DETECTION_MIN_FINAL_HR_FRACTION=${FTP_DETECTION_MIN_FINAL_HR_FRACTION:-0.90}
      - FTP_DETECTION_MAX_MISSING_FRACTION=${FTP_DETECTION_MAX_MISSING_FRACTION:-0.05}
    depends_on:
      mosquitto:
        condition: service_healthy
      intervals-service:
        condition: service_healthy
    restart: unless-stopped

  # delivery-service: versendet Nachrichten aller Quellen per Mail/Discord, mit Wiederholung
  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    container_name: cycling-delivery
    volumes:
      - delivery-data:/app/data
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/delivery;AUTO_SERVER=TRUE
      # Beide Kanaele unabhaengig, Default aus
      - REPORT_MAIL_ENABLED=${REPORT_MAIL_ENABLED:-false}
      - REPORT_MAIL_TO=${REPORT_MAIL_TO:-}
      - REPORT_MAIL_FROM=${REPORT_MAIL_FROM:-}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - REPORT_DISCORD_ENABLED=${REPORT_DISCORD_ENABLED:-false}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
      # Weitere logische Ziele (leer = nicht konfiguriert)
      - DELIVERY_DISCORD_DESTINATIONS_REPORTS=${DELIVERY_DISCORD_DESTINATIONS_REPORTS:-}
      - DELIVERY_DISCORD_DESTINATIONS_FITNESS=${DELIVERY_DISCORD_DESTINATIONS_FITNESS:-}
      - DELIVERY_DISCORD_DESTINATIONS_RECOMMENDATION=${DELIVERY_DISCORD_DESTINATIONS_RECOMMENDATION:-}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # frontend: Angular-App hinter nginx; /api/reports geht an den report-service, /api/fitness und
  # /api/recommendation an den training-service, /api/stats an den stats-service (siehe frontend/nginx.conf).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cycling-frontend
    ports:
      - "80:80"
    depends_on:
      report-service:
        condition: service_healthy
      training-service:
        condition: service_healthy
      stats-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  report-data:
    driver: local
  mosquitto-data:
    driver: local
  delivery-data:
    driver: local
  stats-data:
    driver: local
