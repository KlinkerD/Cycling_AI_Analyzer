server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: alle Routen auf index.html leiten
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST-APIs: je Praefix der zustaendige Service (Specs in openapi/*.yaml)
    # Aktivitaetsliste, Analyse, Report-Seite
    location /api/reports/ {
        proxy_pass http://report-service:8080/api/reports/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Fitness-Chart, Athleten-Schwellen und -Zonen
    location /api/fitness/ {
        proxy_pass http://fitness-service:8080/api/fitness/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Tagesempfehlung (GET /api/recommendation hat keinen Schraegstrich am Ende)
    location /api/recommendation {
        proxy_pass http://recommendation-service:8080/api/recommendation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
