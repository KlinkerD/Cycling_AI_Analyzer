# ============================================================
# intervals-service (einzige Anbindung an intervals.icu, liefert Aktivitaeten,
# Streams, Zonen, Wellness). Neue Aktivitaeten meldet er per MQTT.
# Lokal laeuft er auf Port 8081.
# ============================================================
intervals-service.base-url=${INTERVALS_SERVICE_URL:http://localhost:8081}

# ============================================================
# MQTT-Broker (Mosquitto). Gemini laeuft im ai-service, Auftraege gehen per MQTT.
# Lokal: "docker compose up mosquitto" startet den Broker auf localhost:1883.
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:analysis-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}
# Ohne Antwort des ai-service wird ein Analyse-Job nach dieser Zeit abgebrochen.
analysis.job-timeout=${ANALYSIS_JOB_TIMEOUT:15m}

# ============================================================
# Dein Leistungsprofil (für Zonen-Berechnung)
# FTP = Functional Threshold Power in Watt
# max-hr = Maximale Herzfrequenz in bpm
# ============================================================
cycling.ftp=${CYCLING_FTP:250}
cycling.max-hr=${CYCLING_MAX_HR:190}

# ============================================================
# Tagesempfehlung (Overview): rechnet der recommendation-service, das backend zeigt nur an.
# So lange wartet der Refresh-Button auf die neue Empfehlung, danach gilt der letzte Stand.
# ============================================================
recommendation.refresh-timeout=${RECOMMENDATION_REFRESH_TIMEOUT:10s}

# ============================================================
# H2 Datenbank (persistent, nicht in-memory)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/cycling-analysis;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Server
# ============================================================
server.port=8080
spring.application.name=cycling-analysis
logging.level.com.cycling=DEBUG

# ============================================================
# OpenAPI (springdoc): Spec unter /v3/api-docs, Swagger-UI unter /swagger-ui.html
# Die Spec ist Grundlage fuer den generierten Angular-Client (frontend/openapi).
# ============================================================
springdoc.api-docs.version=openapi_3_0
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.paths-to-match=/api/**
