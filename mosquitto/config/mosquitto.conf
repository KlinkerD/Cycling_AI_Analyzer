# Mosquitto-Broker fuer die Cycling-Services.
# Persistenz an: Sessions und offene QoS-1-Nachrichten ueberstehen einen Broker-Neustart.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Nur im internen Docker-Netz bzw. auf localhost erreichbar (siehe docker-compose.yml).
# Wer den Port ins LAN freigibt, sollte password_file + allow_anonymous false setzen.
listener 1883
allow_anonymous true

# Wie lange ein offline Service seine Session (inkl. verpasster Nachrichten) behalten darf,
# legt jeder Client selbst fest (mqtt.session-expiry, Default 1 Tag).
max_queued_messages 1000
