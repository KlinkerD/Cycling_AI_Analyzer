# ============================================================
# intervals.icu API Konfiguration
# API-Key: intervals.icu → Einstellungen → API → Key generieren
# Athlete-ID: steht in der URL: intervals.icu/athlete/i12345/...
# ============================================================
intervals.api.key=xxx
intervals.athlete.id=xxx

# ============================================================
# Google Gemini API
# Key: https://aistudio.google.com/app/apikey
# ============================================================
gemini.api.key=xxx
gemini.model=gemini-2.5-flash

# ============================================================
# Dein Leistungsprofil (für Zonen-Berechnung)
# FTP = Functional Threshold Power in Watt
# max-hr = Maximale Herzfrequenz in bpm
# ============================================================
cycling.ftp=${CYCLING_FTP:250}
cycling.max-hr=${CYCLING_MAX_HR:190}

# ============================================================
# H2 Datenbank (persistent, nicht in-memory)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/cycling-analysis;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Server
# ============================================================
server.port=8080
spring.application.name=cycling-analysis
logging.level.com.cycling=DEBUG

