spring.application.name=intervals-service
# Lokal 8081, damit die Services (report 8082, training 8083) parallel aus der IDE laufen. Im Container 8080.
server.port=${SERVER_PORT:8081}
logging.level.com.cycling=DEBUG

# Nur der Health-Endpoint (Docker-Healthcheck)
management.endpoints.web.exposure.include=health

# ============================================================
# intervals.icu
# API-Key: intervals.icu -> Einstellungen -> API -> Key generieren
# Athlete-ID: steht in der URL: intervals.icu/athlete/i12345/...
# Ohne beide Werte startet der Service, beantwortet aber jede Anfrage mit 503 INTERVALS_NOT_CONFIGURED.
# ============================================================
intervals.api.key=${INTERVALS_API_KEY:}
intervals.athlete.id=${INTERVALS_ATHLETE_ID:}
intervals.base-url=${INTERVALS_BASE_URL:https://intervals.icu/api/v1}
intervals.connect-timeout=5s
intervals.read-timeout=30s
# Wiederholungen bei 429/5xx/Netzwerkfehlern (1 s, 3 s), Retry-After hoechstens 10 s
intervals.max-retries=2
intervals.max-retry-after=10s
# Hoechstens so viele Anfragen gleichzeitig an intervals.icu
intervals.max-concurrent=4

# ============================================================
# Abfrage neuer Aktivitaeten und der Fitness-Werte
# Raus: cycling/intervals/activity/detected (ActivityDetected)
#       cycling/intervals/wellness/updated  (WellnessUpdated, retained)
# ============================================================
intervals.poll.interval=${INTERVALS_POLL_INTERVAL:15m}
intervals.poll.initial-delay=${INTERVALS_POLL_INITIAL_DELAY:30s}
# Fenster: die letzten N Tage bis morgen
intervals.poll.window-days=2

# ============================================================
# MQTT-Broker
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:intervals-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}
