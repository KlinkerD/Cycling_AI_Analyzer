spring.application.name=report-service
logging.level.com.cycling=DEBUG

# ============================================================
# REST-API fuer Aktivitaetsliste und Report-Seite (/api/reports/...).
# Lokal auf 8082, im Container auf 8080 (SERVER_PORT). Das Frontend ruft ueber
# den Dev-Proxy bzw. nginx auf.
# ============================================================
server.port=${SERVER_PORT:8082}
# Nur /actuator/health (Docker-Healthcheck)
management.endpoints.web.exposure.include=health

# OpenAPI (springdoc): Spec unter /v3/api-docs, Grundlage fuer den generierten
# Angular-Client (frontend/openapi/report-api.yaml).
springdoc.api-docs.version=openapi_3_0
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.paths-to-match=/api/**

# ============================================================
# intervals-service: Aktivitaeten, Streams, Zonen, Schwellen, Power-Curve.
# Lokal laeuft er auf Port 8081.
# ============================================================
intervals-service.base-url=${INTERVALS_SERVICE_URL:http://localhost:8081}
intervals-service.connect-timeout=5s
intervals-service.read-timeout=60s

# ============================================================
# MQTT-Broker
# Rein: cycling/intervals/activity/detected (neue Fahrt -> Analyse starten)
#       cycling/ai/result/report (KI-Antwort)
#       cycling/delivery/status (retained, aktive Kanaele fuer "Erneut senden")
#       cycling/detect/ftp/response (Ergebnis der FTP-Test-Erkennung)
# Raus: cycling/ai/request/report (KI-Auftrag mit fertigem Prompt)
#       cycling/delivery/request/report (DeliveryMessage an den delivery-service)
#       cycling/detect/ftp/request (FTP-Test-Erkennung an den ftp-service)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:report-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}
# Ohne Antwort des ai-service wird ein Analyse-Job nach dieser Zeit abgebrochen.
analysis.job-timeout=${ANALYSIS_JOB_TIMEOUT:15m}
# Ohne Antwort des ftp-service gilt eine FTP-Test-Erkennung nach dieser Zeit als fehlgeschlagen.
ftp-detection.timeout=${FTP_DETECTION_TIMEOUT:2m}

# ============================================================
# Leistungsprofil als Fallback, wenn intervals.icu keine Werte liefert
# FTP = Functional Threshold Power in Watt, max-hr = maximale Herzfrequenz in bpm
# ============================================================
cycling.ftp=${CYCLING_FTP:250}
cycling.max-hr=${CYCLING_MAX_HR:190}

# ============================================================
# H2-Datenbank (Datei): Analysen, Power-Curves, Analyse-Jobs.
# Uebernahme der alten backend-Datenbank: siehe README ("Migration").
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/report;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ============================================================
# Ziele der Reports beim delivery-service, Format KANAL:ziel, kommagetrennt.
# Die Ziele (z. B. "reports") muessen im delivery-service konfiguriert sein.
# Leer = an das Ziel "default" jedes aktiven Kanals.
#   Beispiel: REPORT_TARGETS=DISCORD:reports,MAIL:default
# ============================================================
report.targets=${REPORT_TARGETS:}

# ============================================================
# QuickChart (rendert die Charts als PNG).
# Default: oeffentlicher Endpoint. Fuer self-hosted z.B.
#   quickchart.base-url=http://quickchart:3400
# ============================================================
quickchart.base-url=${QUICKCHART_BASE_URL:https://quickchart.io}

# ============================================================
# Kartenbild (Fahrtverlauf) fuer Mail/Discord.
# Kacheln im Schema {z}/{x}/{y}; Default OpenStreetMap. Leer = nur die Route
# auf neutralem Grund. Der User-Agent ist laut OSM-Nutzungsregeln Pflicht.
# ============================================================
report.map.tile-url=${REPORT_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
report.map.user-agent=${REPORT_MAP_USER_AGENT:cycling-ai-analyzer (self-hosted)}
report.map.attribution=${REPORT_MAP_ATTRIBUTION:\u00a9 OpenStreetMap-Mitwirkende}
