spring.application.name=training-service
logging.level.com.cycling=DEBUG

# ============================================================
# Zustand des Athleten (Fitness, Form, Zonen) und Tagesempfehlung.
# REST-API: /api/fitness (Athlet, Fitness-Chart) und /api/recommendation (Overview-Karte).
# Lokal auf 8083, im Container auf 8080 (SERVER_PORT).
# ============================================================
server.port=${SERVER_PORT:8083}
# Nur /actuator/health (Docker-Healthcheck)
management.endpoints.web.exposure.include=health

# OpenAPI (springdoc): Grundlage fuer den Angular-Client (frontend/openapi/training-api.yaml).
springdoc.api-docs.version=openapi_3_0
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.paths-to-match=/api/**

# ============================================================
# intervals-service: Wellness, Schwellenwerte, Zonen, Fahrten. Lokal auf Port 8081.
# ============================================================
intervals-service.base-url=${INTERVALS_SERVICE_URL:http://localhost:8081}
intervals-service.connect-timeout=5s
intervals-service.read-timeout=60s

# ============================================================
# MQTT-Broker
# Rein: cycling/intervals/wellness/updated (WellnessUpdated, retained)
#       cycling/ai/result/training (KI-Text der Empfehlung)
# Raus: cycling/ai/request/training (KI-Auftrag mit fertigem Prompt)
#       cycling/delivery/request/fitness (Abend-Zusammenfassung an den delivery-service)
#       cycling/delivery/request/recommendation (Morgen-Empfehlung an den delivery-service)
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:training-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}

# Zeitzone fuer "heute", Versandzeiten und Zeitplan
training.zone=${TRAINING_ZONE:Europe/Berlin}

# ============================================================
# Fitness-Zusammenfassung: ab dieser Uhrzeit (HH:mm) einmal pro Tag.
# Liegt dann noch kein Stand von heute vor, wird bis Mitternacht nachgeholt.
# ============================================================
fitness.summary.time=${FITNESS_SUMMARY_TIME:21:00}
fitness.summary.check-interval=1m
fitness.summary.initial-delay=1m
# Ziele beim delivery-service, Format KANAL:ziel, kommagetrennt. Das Ziel "fitness" muss im
# delivery-service konfiguriert sein (DELIVERY_DISCORD_DESTINATIONS_FITNESS).
# Leer = an das Ziel "default" jedes aktiven Kanals.
fitness.targets=${FITNESS_TARGETS:DISCORD:fitness}

# ============================================================
# Tagesempfehlung
# ============================================================
# Regelmaessige Neuberechnung fuer die Overview-Karte (Spring-Cron, 6 Felder)
recommendation.refresh.cron=${RECOMMENDATION_REFRESH_CRON:0 0 */4 * * *}
# So lange wird hoechstens auf den KI-Text gewartet, danach bleibt der Fallback-Text
recommendation.text-timeout=90s
# Morgen-Nachricht: ab dieser Uhrzeit (HH:mm) einmal pro Tag, frisch berechnet.
# Gesendet wird mit KI-Text, spaetestens nach text-wait mit Fallback-Text.
# Nach einem Neustart wird nur bis catch-up-until nachgeholt.
recommendation.daily.time=${RECOMMENDATION_DAILY_TIME:09:00}
recommendation.daily.catch-up-until=${RECOMMENDATION_DAILY_CATCH_UP_UNTIL:12:00}
recommendation.daily.text-wait=2m
recommendation.daily.check-interval=1m
recommendation.daily.initial-delay=1m
# Ziele beim delivery-service; das Ziel "recommendation" muss dort konfiguriert sein
# (DELIVERY_DISCORD_DESTINATIONS_RECOMMENDATION). Leer = an das Ziel "default" jedes aktiven Kanals.
recommendation.targets=${RECOMMENDATION_TARGETS:DISCORD:recommendation}
