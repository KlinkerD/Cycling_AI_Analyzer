openapi: 3.0.1
info:
  title: Cycling Recommendation API
  version: "1"
servers:
- url: /
paths:
  /api/recommendation:
    get:
      operationId: getRecommendation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRecommendationDto"
          description: Aktuelle Empfehlung
        "503":
          description: Noch keine Empfehlung und intervals-service nicht erreichbar
      tags:
      - Recommendation
  /api/recommendation/refresh:
    post:
      operationId: refreshRecommendation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRecommendationDto"
          description: Neue (oder bei Fehlern die letzte) Empfehlung
        "503":
          description: Noch keine Empfehlung und intervals-service nicht erreichbar
      tags:
      - Recommendation
components:
  schemas:
    DailyRecommendationDto:
      type: object
      properties:
        category:
          type: string
          enum:
          - REST
          - EASY
          - ENDURANCE
          - TEMPO
          - HARD_INTERVALS
          - INSUFFICIENT_DATA
        categoryLabel:
          type: string
        color:
          type: string
        computedAt:
          type: string
          format: date-time
          nullable: true
        form:
          type: number
          format: double
          nullable: true
        rampCapped:
          type: boolean
        rampRate:
          type: number
          format: double
          nullable: true
        refDate:
          type: string
          format: date
          nullable: true
        text:
          type: string
        textPending:
          type: boolean
      required:
      - category
      - categoryLabel
      - color
      - computedAt
      - form
      - rampCapped
      - rampRate
      - refDate
      - text
      - textPending
