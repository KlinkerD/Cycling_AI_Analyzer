openapi: 3.0.1
info:
  title: Cycling Stats API
  version: "1"
servers:
- url: /
paths:
  /api/stats:
    get:
      operationId: getStats
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: groupBy
        required: false
        schema:
          type: string
          default: MONTH
          enum:
          - NONE
          - WEEK
          - MONTH
          - YEAR
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsDto"
          description: OK
      tags:
      - Stats
  /api/stats/status:
    get:
      operationId: getStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatusDto"
          description: OK
      tags:
      - Stats
  /api/stats/year-to-date:
    get:
      operationId: getYearToDate
      parameters:
      - in: query
        name: groupBy
        required: false
        schema:
          type: string
          default: MONTH
          enum:
          - NONE
          - WEEK
          - MONTH
          - YEAR
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearToDateDto"
          description: OK
      tags:
      - Stats
components:
  schemas:
    StatsDto:
      type: object
      properties:
        from:
          type: string
          format: date
        groupBy:
          type: string
          enum:
          - NONE
          - WEEK
          - MONTH
          - YEAR
        periods:
          type: array
          items:
            $ref: "#/components/schemas/StatsPeriodDto"
        to:
          type: string
          format: date
        total:
          $ref: "#/components/schemas/StatsPeriodDto"
      required:
      - from
      - groupBy
      - periods
      - to
      - total
    StatsPeriodDto:
      type: object
      properties:
        distance:
          type: number
          format: double
        elapsedTime:
          type: integer
          format: int64
        elevationGain:
          type: number
          format: double
        from:
          type: string
          format: date
        hrZones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneTimeDto"
        movingTime:
          type: integer
          format: int64
        powerZones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneTimeDto"
        rides:
          type: integer
          format: int32
        ridesWithHeartRate:
          type: integer
          format: int32
        ridesWithPower:
          type: integer
          format: int32
        to:
          type: string
          format: date
        trainingLoad:
          type: number
          format: double
      required:
      - distance
      - elapsedTime
      - elevationGain
      - from
      - hrZones
      - movingTime
      - powerZones
      - rides
      - ridesWithHeartRate
      - ridesWithPower
      - to
      - trainingLoad
    SyncStatusDto:
      type: object
      properties:
        importRunning:
          type: boolean
        importStart:
          type: string
          format: date
        lastSync:
          type: string
          format: date-time
          nullable: true
        newestRide:
          type: string
          format: date
          nullable: true
        oldestRide:
          type: string
          format: date
          nullable: true
        rides:
          type: integer
          format: int64
        ridesWithoutZones:
          type: integer
          format: int32
      required:
      - importRunning
      - importStart
      - lastSync
      - newestRide
      - oldestRide
      - rides
      - ridesWithoutZones
    YearToDateDto:
      type: object
      properties:
        current:
          $ref: "#/components/schemas/StatsDto"
        importRunning:
          type: boolean
        previousYear:
          $ref: "#/components/schemas/StatsDto"
        year:
          type: integer
          format: int32
      required:
      - current
      - importRunning
      - previousYear
      - year
    ZoneTimeDto:
      type: object
      properties:
        color:
          type: string
          nullable: true
        label:
          type: string
        percentage:
          type: number
          format: double
        seconds:
          type: integer
          format: int64
        zone:
          type: string
      required:
      - color
      - label
      - percentage
      - seconds
      - zone
