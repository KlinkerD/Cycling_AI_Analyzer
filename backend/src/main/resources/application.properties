# ============================================================
# intervals.icu API Konfiguration
# API-Key: intervals.icu → Einstellungen → API → Key generieren
# Athlete-ID: steht in der URL: intervals.icu/athlete/i12345/...
# ============================================================
intervals.api.key=xx
intervals.athlete.id=xx

# ============================================================
# MQTT-Broker (Mosquitto). Gemini laeuft im ai-service, Auftraege gehen per MQTT.
# Lokal: "docker compose up mosquitto" startet den Broker auf localhost:1883.
# ============================================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:analysis-service}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.session-expiry=${MQTT_SESSION_EXPIRY:1d}
# Ohne Antwort des ai-service wird ein Analyse-Job nach dieser Zeit abgebrochen.
analysis.job-timeout=${ANALYSIS_JOB_TIMEOUT:15m}

# ============================================================
# Dein Leistungsprofil (für Zonen-Berechnung)
# FTP = Functional Threshold Power in Watt
# max-hr = Maximale Herzfrequenz in bpm
# ============================================================
cycling.ftp=${CYCLING_FTP:250}
cycling.max-hr=${CYCLING_MAX_HR:190}

# ============================================================
# Tagesempfehlung (Overview)
# Cron-Takt fuer die automatische Neuberechnung (Spring-Cron, 6 Felder).
# Default: alle 4 Stunden zur vollen Stunde (00:00, 04:00, 08:00 ...).
# ============================================================
recommendation.refresh.cron=${RECOMMENDATION_REFRESH_CRON:0 0 */4 * * *}

# ============================================================
# H2 Datenbank (persistent, nicht in-memory)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/cycling-analysis;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Server
# ============================================================
server.port=8080
spring.application.name=cycling-analysis
logging.level.com.cycling=DEBUG
